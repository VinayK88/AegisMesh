[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegismesh"
version = "0.1.0"
description = "Defensive multi-agent AI security orchestration lab"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
aegismesh = "aegismesh.__main__:main"

[tool.setuptools.packages.find]
include = ["aegismesh*"]
