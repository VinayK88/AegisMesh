  <text x="82" y="294" font-family="Inter,Arial" font-size="15" fill="#a8b7cb">Modeled path</text>
  <text x="82" y="322" font-family="monospace" font-size="14" fill="#dbeafe">identity → session → SaaS → data</text>
  <text x="82" y="358" font-family="Inter,Arial" font-size="14" fill="#a8b7cb">Scope</text>
  <text x="174" y="358" font-family="Inter,Arial" font-size="14" font-weight="700" fill="#86efac">simulation only</text>
  <text x="82" y="386" font-family="Inter,Arial" font-size="14" fill="#a8b7cb">Live exploit tools</text>
  <text x="210" y="386" font-family="Inter,Arial" font-size="14" font-weight="700" fill="#86efac">none</text>

  <rect x="502" y="180" width="396" height="230" rx="18" fill="#111d30" stroke="#2a3d58"/>
