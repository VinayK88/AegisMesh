<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">AegisMesh dashboard preview</title>
  <desc id="desc">Static synthetic preview of Red, Blue, Green agents and safety telemetry.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0e2038"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#34d399"/></linearGradient>
  </defs>
  <rect width="1400" height="820" rx="28" fill="url(#bg)"/>
  <text x="56" y="68" font-family="Inter,Arial" font-size="30" font-weight="800" fill="#f8fafc">AegisMesh</text>
  <text x="56" y="100" font-family="Inter,Arial" font-size="14" font-weight="600" fill="#7dd3fc">MULTI-AGENT AI SECURITY ORCHESTRATION · STATIC SYNTHETIC PREVIEW</text>
