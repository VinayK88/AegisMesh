  <text x="275" y="526" font-family="Inter,Arial" font-size="18" fill="#64748b">→</text>
  <text x="315" y="526" font-family="Inter,Arial" font-size="18" font-weight="700" fill="#f8fafc">role allowlist</text>
  <text x="468" y="526" font-family="Inter,Arial" font-size="18" fill="#64748b">→</text>
  <text x="508" y="526" font-family="Inter,Arial" font-size="18" font-weight="700" fill="#f8fafc">approval boundary</text>
  <text x="700" y="526" font-family="Inter,Arial" font-size="18" fill="#64748b">→</text>
  <text x="740" y="526" font-family="Inter,Arial" font-size="18" font-weight="700" fill="#f8fafc">synthetic execution</text>
  <text x="935" y="526" font-family="Inter,Arial" font-size="18" fill="#64748b">→</text>
  <text x="975" y="526" font-family="Inter,Arial" font-size="18" font-weight="700" fill="#f8fafc">trace + evidence</text>

  <rect x="56" y="618" width="300" height="130" rx="18" fill="#111d30" stroke="#2a3d58"/>
  <text x="82" y="652" font-family="Inter,Arial" font-size="12" font-weight="800" fill="#94a3b8">SCENARIO LIBRARY</text>
  <text x="82" y="704" font-family="Inter,Arial" font-size="32" font-weight="800" fill="#f8fafc">3</text>
  <text x="130" y="704" font-family="Inter,Arial" font-size="14" fill="#a8b7cb">versioned synthetic paths</text>

  <rect x="382" y="618" width="300" height="130" rx="18" fill="#111d30" stroke="#2a3d58"/>
