  <text x="632" y="294" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#86efac">evidence IDs retained</text>
  <text x="528" y="330" font-family="Inter,Arial" font-size="15" fill="#a8b7cb">Retrieval</text>
  <text x="632" y="330" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#dbeafe">local security corpus</text>
  <text x="528" y="366" font-family="Inter,Arial" font-size="15" fill="#a8b7cb">Output</text>
  <text x="632" y="366" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#dbeafe">path + evidence + context</text>

  <rect x="948" y="180" width="396" height="230" rx="18" fill="#111d30" stroke="#2a3d58"/>
