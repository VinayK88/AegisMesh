  <text x="408" y="704" font-family="Inter,Arial" font-size="22" font-weight="800" fill="#f8fafc">Red → Blue → Green</text>

  <rect x="708" y="618" width="300" height="130" rx="18" fill="#111d30" stroke="#2a3d58"/>
  <text x="734" y="652" font-family="Inter,Arial" font-size="12" font-weight="800" fill="#94a3b8">CONSEQUENTIAL ACTIONS</text>
  <text x="734" y="704" font-family="Inter,Arial" font-size="22" font-weight="800" fill="#fcd34d">approval-gated</text>

  <rect x="1034" y="618" width="310" height="130" rx="18" fill="#111d30" stroke="#2a3d58"/>
  <text x="1060" y="652" font-family="Inter,Arial" font-size="12" font-weight="800" fill="#94a3b8">OBSERVABILITY</text>
  <text x="1060" y="704" font-family="Inter,Arial" font-size="22" font-weight="800" fill="#86efac">policy + step traces</text>

  <rect x="56" y="776" width="1288" height="5" rx="2.5" fill="url(#accent)"/>
