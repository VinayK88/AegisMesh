  <text x="974" y="366" font-family="Inter,Arial" font-size="15" fill="#a8b7cb">Authority</text>
  <text x="1078" y="366" font-family="Inter,Arial" font-size="15" font-weight="700" fill="#fcd34d">recommendation only</text>

  <rect x="56" y="452" width="1288" height="124" rx="18" fill="#0e1a2b" stroke="#2a3d58"/>
